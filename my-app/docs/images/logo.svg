<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="680" height="200">
  <defs>
    <linearGradient id="tiffinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9052"/>
      <stop offset="100%" stop-color="#E96B2E"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F3A5F"/>
      <stop offset="100%" stop-color="#132745"/>
    </linearGradient>
  </defs>

  <!-- Icon: tiffin box + ledger badge -->
  <g transform="translate(20,20)">
    <!-- base tier -->
    <rect x="0" y="80" width="150" height="72" rx="13" fill="url(#tiffinGrad)"/>
    <!-- middle tier -->
    <rect x="7" y="48" width="136" height="40" rx="11" fill="#FFA968"/>
    <!-- lid -->
    <rect x="0" y="16" width="150" height="36" rx="13" fill="url(#lidGrad)"/>
    <!-- handle -->
    <path d="M 56 16 Q 56 -10 75 -10 Q 94 -10 94 16" fill="none" stroke="#132745" stroke-width="9" stroke-linecap="round"/>
    <!-- tier seams -->
    <rect x="7" y="86" width="136" height="5" rx="2.5" fill="#C6511F" opacity="0.5"/>
    <rect x="7" y="54" width="136" height="5" rx="2.5" fill="#E07B3B" opacity="0.4"/>

    <!-- ledger / rupee badge, overlapping bottom-right of the box -->
    <circle cx="132" cy="140" r="34" fill="#FFFFFF"/>
    <circle cx="132" cy="140" r="34" fill="none" stroke="#1F3A5F" stroke-width="3"/>
    <text x="132" y="153" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#1F3A5F" text-anchor="middle">₹</text>
  </g>

  <!-- Wordmark -->
  <text x="235" y="98" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="54" font-weight="700" fill="#132745">Tiffin</text>
  <text x="235" y="148" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="54" font-weight="700" fill="#E96B2E">Books</text>
  <text x="237" y="172" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="2" fill="#6B7C93">SALES · PURCHASES · EXPENSES</text>
</svg>
